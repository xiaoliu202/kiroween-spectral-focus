name: Verify and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      # Google Chrome is preinstalled on GitHub-hosted Ubuntu runners.
      SPECTRAL_BROWSER_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Keep browser evidence from CI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence
          path: |
            evidence/browser-results.json
            evidence/*.png

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy only the static production files
        run: |
          mkdir _site
          cp index.html style.css model.js art.js lore.js ambience.js app.js favicon.svg _site/
          touch _site/.nojekyll
          # Bust browser caches on every deploy so HTML, CSS and JS always match.
          sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" _site/index.html
          if grep -q '?v=dev' _site/index.html; then echo 'Asset version was not stamped' >&2; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
